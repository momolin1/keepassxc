name: Building test
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      VCPKG_ROOT: 'C:\vcpkg'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Export GitHub Actions Cache Environment
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # 1. Add cppwinrt to the manifest properly
      - name: Add dependencies to Manifest
        run: |
          $manifest = Get-Content vcpkg.json | ConvertFrom-Json
          if ($manifest.dependencies -notcontains "cppwinrt") {
              $manifest.dependencies += "cppwinrt"
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content vcpkg.json

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install Asciidoctor
        run: gem install asciidoctor

      # 2. Configure with explicit Windows Targeting
      - name: Configure CMake
        run: |
          mkdir build
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DWITH_XC_ALL=ON `
            -DWITH_XC_WINHELLO=ON `
            -DCMAKE_SYSTEM_VERSION=10.0.22621.0

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Deploy Qt Dependencies
        run: |
          $WINDEPLOYQT = "build/vcpkg_installed/x64-windows/tools/qt5-tools/bin/windeployqt.exe"
          & $WINDEPLOYQT --release --no-translations --no-opengl-sw build/src/Release/keepassxc.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeePassXC-Windows-Binary
          path: |
            build/src/Release/keepassxc.exe
            build/src/Release/*.dll
