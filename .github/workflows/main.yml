name: Windows Build (with Hello)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      VCPKG_ROOT: 'C:\vcpkg'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Export GitHub Actions Cache Environment
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache vcpkg root
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-${{ hashFiles('vcpkg.json') }}-${{ runner.os }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Cache Ruby gems
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\.gem\ruby\3.2.0\gems
          key: ruby-gems-${{ runner.os }}
          restore-keys: ruby-gems-${{ runner.os }}-

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Asciidoctor
        run: gem install asciidoctor

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}-

      - name: Deploy Qt Dependencies  # FIXED PATH
        shell: pwsh
        run: |
          $WINDEPLOYQT = "build/vcpkg_installed/x64-windows/tools/qt5/bin/windeployqt.exe"
          & $WINDEPLOYQT --release --no-translations --no-opengl-sw build/src/Release/keepassxc.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeePassXC-Windows-Binary
          path: |
            build/src/Release/keepassxc.exe
            build/src/Release/*.dll
