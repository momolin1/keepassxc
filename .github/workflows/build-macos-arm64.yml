name: Build KeePassXC 2.7.11 macOS ARM64 (M4 - Custom)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-arm64:
    runs-on: macos-latest

    steps:
    - name: Checkout stable 2.7.11
      uses: actions/checkout@v4
      with:
        ref: 2.7.11
        submodules: recursive

    # CACHE: Homebrew
    - name: Cache Homebrew
      id: cache-homebrew
      uses: actions/cache@v4
      with:
        path: /usr/local/Homebrew
        key: homebrew-macos-latest-custom-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: homebrew-macos-latest-custom-

    - name: Update Homebrew (if cache miss)
      if: steps.cache-homebrew.outputs.cache-hit != 'true'
      run: brew update

    - name: Install Qt5 + deps
      run: |
        brew install cmake asciidoctor qt@5 argon2 Botan qrencode yubikey-personalization libyubikey readline minizip || true

    # CACHE: Build
    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: |
          build/
          !build/*.dmg
          !build/*.zip
        key: macos-latest-custom-qt5-${{ hashFiles('**/CMakeLists.txt') }}-${{ env.BUILD_TYPE }}
        restore-keys: macos-latest-custom-qt5-

    - name: Configure CMake (YOUR FLAGS + Qt5)
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
          -DWITH_XC_ALL=OFF \
          -DWITH_XC_AUTOTYPE=ON \
          -DWITH_XC_BROWSER=ON \
          -DWITH_XC_BROWSER_PASSKEYS=ON \
          -DWITH_XC_YUBIKEY=ON \
          -DWITH_XC_NETWORKING=OFF \
          -DWITH_XC_UPDATECHECK=OFF \
          -DWITH_XC_SSHAGENT=OFF \
          -DWITH_XC_KEESHARE=OFF \
          -DWITH_APP_BUNDLE=ON \
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)/lib/cmake"
        cd ..

    - name: Build + Package DMG
      run: |
        cd build
        cmake --build . --parallel $(sysctl -n hw.ncpu)
        echo "Ad-hoc signing the application bundle..."
        # Sign the internal executable first, then the whole bundle
        # This uses '-' which represents an ad-hoc signature (no Apple ID required)
        codesign --force --deep --sign - src/KeePassXC.app
        make package

    - name: Package portable ZIP
      run: |
        cd build
        mkdir -p package
        cp -R src/*.app package/
        ditto -c -k --sequesterRsrc --keepParent package "KeePassXC-2.7.11-macOS-arm64-Custom.zip"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: KeePassXC-2.7.11-macOS-arm64-Custom
        path: |
          build/*.dmg
          build/KeePassXC-2.7.11-macOS-arm64-Custom.zip
        retention-days: 30
