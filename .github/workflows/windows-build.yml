name: Build KeePassXC 2.7.11 Windows x64 (vcpkg Fixed + VS)

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: 2.7.11
        submodules: recursive

    # Safe vcpkg (cmd for bat)
    - name: Cache vcpkg
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: C:\vcpkg
        key: vcpkg-keepassxc-${{ hashFiles('CMakeLists.txt') }}

    - name: Setup vcpkg
      shell: cmd
      run: |
        if not exist C:\vcpkg\vcpkg.exe (
          rmdir /s /q C:\vcpkg
          git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
          call C:\vcpkg\bootstrap-vcpkg.bat
        )
        C:\vcpkg\vcpkg.exe install --triplet x64-windows ^
          qt5-base[core,svg,tools] ^
          libgcrypt libargon2 libqrencode botan ^
          yubico-piv-tool argon2

    # Build steps same
    - name: Cache build
      uses: actions/cache@v4
      with:
        path: build
        key: build-vs-${{ hashFiles('CMakeLists.txt') }}

    - name: Configure
      shell: cmd
      run: |
        cmake -B build ^
          -G "Visual Studio 17 2022" ^
          -A x64 ^
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
          -DWITH_TESTS=OFF ^
          -DWITH_XC_ALL=OFF ^
          -DWITH_XC_NETWORKING=OFF ^
          -DWITH_XC_BROWSER=OFF ^
          -DWITH_XC_FAVICON=OFF ^
          -DWITH_XC_SSHAGENT=OFF ^
          -DWITH_XC_KEESHARE=OFF ^
          -DWITH_XC_YUBIKEY=OFF


