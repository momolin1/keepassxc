name: Build KeePassXC 2.7.11 Windows x64 (Custom - No Cache, Asciidoctor)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  VCPKG_ROOT: C:\vcpkg

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout stable 2.7.11
      uses: actions/checkout@v4
      with:
        ref: 2.7.11
        submodules: recursive

    # Install Ruby + Asciidoctor (for documentation)
    - name: Install Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    - name: Install Asciidoctor
      shell: pwsh
      run: |
        gem install asciidoctor
        asciidoctor --version

    - name: Install vcpkg
      shell: pwsh
      run: |
        git clone https://github.com/Microsoft/vcpkg.git ${{ env.VCPKG_ROOT }}
        . ${{ env.VCPKG_ROOT }}\bootstrap-vcpkg.bat
        ${{ env.VCPKG_ROOT }}\vcpkg integrate install

    - name: Install dependencies
      shell: pwsh
      run: ${{ env.VCPKG_ROOT }}\vcpkg install --triplet x64-windows

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. `
          -G "Ninja" `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DWITH_XC_ALL=OFF `
          -DWITH_XC_NETWORKING=OFF `
          -DWITH_XC_SSHAGENT=OFF `
          -DWITH_XC_KEESHARE=OFF `
          -DWITH_TESTS=OFF

    - name: Build
      run: |
        cd build
        cmake --build . --config ${{ env.BUILD_TYPE }}

    - name: Package ZIP
      shell: pwsh
      run: |
        cd build
        mkdir package
        copy src\KeePassXC.exe package\
        copy src\*.dll package\
        Compress-Archive -Path package\* -DestinationPath KeePassXC-2.7.11-Win64-Custom.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: KeePassXC-2.7.11-Win64-Custom
        path: build\KeePassXC-2.7.11-Win64-Custom.zip
        retention-days: 30
