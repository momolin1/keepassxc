name: Windows Build (Custom + Cache)

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      VCPKG_ROOT: 'C:\vcpkg'

    steps:
      - name: Checkout stable 2.7.11
        uses: actions/checkout@v4
        with:
          ref: 2.7.11

      # CACHE: vcpkg (~25min → 1min)
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-win-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: vcpkg-win-

      # vcpkg: NO commit ID (latest stable)
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}

      # Install deps (cached)
      - name: Install deps
        run: |
          vcpkg install --triplet x64-windows ^
            qt5-base qt5-svg qt5-tools libgcrypt libargon2 libqrencode Botan yubico-piv-tool ^
            --feature-flags=manifests

      # CACHE: Build (~35min → 5min)
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            build/
            !build/*.exe
            !build/*.dll
            !build/*.zip
          key: win-build-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: win-build-

      - name: Configure CMake (YOUR FLAGS)
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DWITH_XC_ALL=OFF ^
            -DWITH_XC_AUTOTYPE=ON ^
            -DWITH_XC_BROWSER=ON ^
            -DWITH_XC_BROWSER_PASSKEYS=ON ^
            -DWITH_XC_YUBIKEY=ON ^
            -DWITH_XC_NETWORKING=OFF ^
            -DWITH_XC_UPDATECHECK=OFF ^
            -DWITH_XC_SSHAGENT=OFF ^
            -DWITH_XC_KEESHARE=OFF ^
            -DWITH_APP_BUNDLE=ON

      - name: Build (sequential)
        run: cmake --build build --config Release

      - name: Package clean ZIP
        shell: pwsh
        run: |
          $files = Get-ChildItem build\src\Release\* -Include *.exe,*.dll,qt.conf,platforms -Recurse | 
                   Where { $_.Name -notmatch '\.(lib|exp|pdb)$' }
          Compress-Archive $files.FullName "KeePassXC-2.7.11-Win64-Custom.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: KeePassXC-2.7.11-Win64-Custom
          path: KeePassXC-2.7.11-Win64-Custom.zip
