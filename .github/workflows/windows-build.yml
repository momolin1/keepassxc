name: KeePassXC Official Windows Build
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      VCPKG_ROOT: 'C:\vcpkg'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Export GitHub Actions Cache Environment
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # 1. Prepare Environment (Asciidoctor is required for the build)
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install Asciidoctor
        run: gem install asciidoctor

      # 2. Add WinRT Support (Necessary for Windows Hello)
      # We inject 'cppwinrt' into the vcpkg manifest so the linker finds Hello symbols
      - name: Add Windows Hello Support
        run: |
          $manifest = Get-Content vcpkg.json | ConvertFrom-Json
          if ($manifest.dependencies -notcontains "cppwinrt") {
              $manifest.dependencies += "cppwinrt"
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content vcpkg.json

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}-

      # 3. Configure CMake using Ninja (as recommended in the wiki)
      - name: Configure CMake
        run: |
          mkdir build
          cmake -G "Visual Studio 17 2022" -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DWITH_XC_ALL=ON `
            -DWITH_XC_SSHAGENT=OFF `
            -DWITH_XC_NETWORKING=OFF `
            -DDWITH_XC_KEESHARE=OFF `
           

      # Build using MSVC (via CMake build wrapper)
      - name: Build
        run: cmake --build build --config Release --parallel 4
