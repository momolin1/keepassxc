name: KeePassXC Windows Build (Classic vcpkg + VS)

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: 2.7.11
        submodules: recursive

    # vcpkg classic mode (ignores vcpkg.json)
    - name: Cache vcpkg
      uses: actions/cache@v4
      id: cache-vcpkg
      with:
        path: C:\vcpkg
        key: vcpkg-keepassxc-classic-${{ hashFiles('CMakeLists.txt') }}

    - name: Setup vcpkg Classic
      shell: cmd
      run: |
        if not exist C:\vcpkg\vcpkg.exe (
          rmdir /s /q C:\vcpkg
          git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
          call C:\vcpkg\bootstrap-vcpkg.bat
        )
        C:\vcpkg\vcpkg.exe install --triplet x64-windows ^
          --x-manifest-mode=classic ^
          qt5-base qt5-svg qt5-tools ^
          libgcrypt libargon2 libqrencode ^
          botan yubico-piv-tool ^
          argon2 --clean-after-build

    # Build cache
    - name: Cache build
      uses: actions/cache@v4
      with:
        path: build
        key: build-vs-keepassxc-${{ hashFiles('CMakeLists.txt') }}

    - name: Configure CMake
      shell: cmd
      run: |
        cmake -B build ^
          -G "Visual Studio 17 2022" ^
          -A x64 ^
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
          -DWITH_TESTS=OFF ^
          -DWITH_XC_ALL=OFF ^
          -DWITH_XC_NETWORKING=OFF ^
          -DWITH_XC_BROWSER=OFF ^
          -DWITH_XC_FAVICON=OFF ^
          -DWITH_XC_SSHAGENT=OFF ^
          -DWITH_XC_KEESHARE=OFF

