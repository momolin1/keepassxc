name: Build KeePassXC 2.7.11 Windows x64 (Fixed vcpkg + VS)

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest  # = windows-2025 ok

    steps:
    - name: Checkout 2.7.11
      uses: actions/checkout@v4
      with:
        ref: 2.7.11
        submodules: recursive

    # vcpkg cache/setup (always safe)
    - name: Cache vcpkg
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: C:\vcpkg
        key: vcpkg-keepassxc-${{ hashFiles('CMakeLists.txt') }}

    - name: Setup vcpkg
      shell: pwsh
      run: |
        if (!(Test-Path C:\vcpkg\vcpkg.exe) -or !(Test-Path C:\vcpkg\installed)) {
          Remove-Item -Recurse -Force C:\vcpkg -ErrorAction SilentlyContinue
          git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
          .\C:\vcpkg\bootstrap-vcpkg.bat
        }
        C:\vcpkg\vcpkg.exe install --triplet x64-windows `
          qt5-base[core,svg,tools] `
          libgcrypt libargon2 libqrencode botan

    # Build cache
    - name: Cache build
      uses: actions/cache@v4
      with:
        path: build
        key: build-vs-${{ hashFiles('CMakeLists.txt') }}

    - name: Configure CMake
      run: |
        cmake -B build ^
          -G "Visual Studio 17 2022" ^
          -A x64 ^
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
          -DWITH_TESTS=OFF ^
          -DWITH_XC_ALL=OFF ^
          -DWITH_XC_NETWORKING=OFF ^
          -DWITH_XC_BROWSER=OFF ^
          -DWITH_XC_FAVICON=OFF ^
          -DWITH_XC_SSHAGENT=OFF ^
          -DWITH_XC_KEESHARE=OFF ^
          -DWITH_XC_YUBIKEY=OFF

    - name: Build
      run: cmake --build build --config Release /maxcpucount:4

    - name: Package ZIP
      shell: pwsh
      run: |
        mkdir dist | Out-Null
        Copy-Item build\Release\KeePassXC.exe dist\ | Out-Null
        Copy-Item build\Release\*.dll dist\ -ErrorAction SilentlyContinue
        Compress-Archive dist KeePassXC-2.7.11-Win64-Fixed.zip -Force

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: KeePassXC-2.7.11-Win64-Fixed
        path: KeePassXC-2.7.11-Win64-Fixed.zip
