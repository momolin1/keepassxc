name: Windows Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Install Ruby and Asciidoctor (The "Proper Fix")
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2' # Stable Ruby version
          
      - name: Install Asciidoctor
        run: gem install asciidoctor

      # 2. Setup VCPKG environment
      - name: Set VCPKG_ROOT
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_PATH

      # 3. Restore the 2.1-hour cache
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}/installed
            ${{ env.VCPKG_ROOT }}/packages
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      # 4. Configure CMake (Now includes the doc tools)
      - name: Configure CMake
        run: |
          mkdir build
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DWITH_XC_ALL=ON

      # 5. Final Compilation
      - name: Build
        run: |
          cmake --build build --config Release --parallel

      # 6. Save the .exe
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeePassXC-Windows-Binary
          path: build/src/Release/keepassxc.exe
