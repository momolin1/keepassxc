name: Build KeePassXC 2.7.11 Windows x64 (No Hello + VS - Fixed)

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout 2.7.11
      uses: actions/checkout@v4
      with:
        ref: 2.7.11
        submodules: recursive

    # vcpkg cache
    - name: Cache vcpkg
      uses: actions/cache@v4
      id: vcpkg-cache
      with:
        path: C:\vcpkg
        key: vcpkg-keepassxc-${{ hashFiles('CMakeLists.txt') }}

    - name: Install vcpkg + deps (incl cred prov)
      if: steps.vcpkg-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
        .\C:\vcpkg\bootstrap-vcpkg.bat
        C:\vcpkg\vcpkg.exe install --triplet x64-windows `
          qt5-base[core,svg,tools] `
          libgcrypt libargon2 libqrencode botan `
          yubico-piv-tool argon2

    # Build cache
    - name: Cache build
      uses: actions/cache@v4
      with:
        path: |
          build
          !build/Release/*.pdb
        key: build-vs-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}

    - name: Configure (VS + Static CRT + No Hello deps)
      run: |
        cmake -B build ^
          -G "Visual Studio 17 2022" ^
          -A x64 ^
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
          -DWITH_TESTS=OFF ^
          -DWITH_XC_ALL=OFF ^
          -DWITH_XC_NETWORKING=OFF ^
          -DWITH_XC_BROWSER=OFF ^
          -DWITH_XC_FAVICON=OFF ^
          -DWITH_XC_SSHAGENT=OFF ^
          -DWITH_XC_KEESHARE=OFF ^
          -DWITH_XC_YUBIKEY=OFF  # Avoids extra deps

    - name: Build Release
      run: cmake --build build --config Release /maxcpucount:4

    - name: Package ZIP (portable no Hello)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path dist -Force
        Copy-Item build\Release\KeePassXC.exe dist\
        Get-ChildItem build\Release\*.dll | Copy-Item -Destination dist\
        Compress-Archive dist KeePassXC-2.7.11-Win64-NoHello.zip -Force

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: KeePassXC-2.7.11-Win64-NoHello-Fixed
        path: KeePassXC-2.7.11-Win64-NoHello.zip
