name: Windows Build (with Hello)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      VCPKG_ROOT: 'C:\vcpkg'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Export GitHub Actions Cache Environment
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Windows Hello Dependencies
        run: |
          # Use --classic to bypass the manifest check and install to the system root
          vcpkg install cppwinrt:x64-windows --classic

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          
      - name: Install Asciidoctor
        run: gem install asciidoctor

      - name: Configure CMake
        run: |
          mkdir build
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DWITH_XC_ALL=ON `
            -DWITH_XC_WINHELLO=ON 

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      # This step gathers all the required .dll files so the app can actually run
      - name: Deploy Qt Dependencies
        run: |
          $WINDEPLOYQT = "build/vcpkg_installed/x64-windows/tools/qt5-tools/bin/windeployqt.exe"
          & $WINDEPLOYQT --release --no-translations --no-opengl-sw build/src/Release/keepassxc.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeePassXC-Windows-Binary
          path: |
            build/src/Release/keepassxc.exe
            build/src/Release/*.dll
