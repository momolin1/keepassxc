name: Build KeePassXC 2.7.11 Windows x64 (Your Features - MSVC)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  VCPKG_ROOT: C:\vcpkg

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout stable 2.7.11
      uses: actions/checkout@v4
      with:
        ref: 2.7.11
        submodules: recursive

    # Ruby/Asciidoctor (for browser integration docs)
    - name: Install Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    - name: Install Asciidoctor
      shell: pwsh
      run: gem install asciidoctor

    # Force MSVC + Ninja (no MinGW)
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Install Ninja
      shell: pwsh
      run: |
        choco install ninja -y
        echo "C:\tools\ninja" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

    - name: Install vcpkg
      shell: pwsh
      run: |
        git clone https://github.com/Microsoft/vcpkg.git ${{ env.VCPKG_ROOT }}
        . ${{ env.VCPKG_ROOT }}\bootstrap-vcpkg.bat
        ${{ env.VCPKG_ROOT }}\vcpkg integrate install

    - name: Install dependencies
      shell: pwsh
      run: ${{ env.VCPKG_ROOT }}\vcpkg install --triplet x64-windows

    - name: Configure CMake (Your exact flags)
      shell: pwsh
      run: |
        mkdir build
        cd build
        cmake .. `
          -G "Ninja" `
          -T v140_xp `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DWITH_XC_ALL=OFF `
          -DWITH_XC_AUTOTYPE=ON `
          -DWITH_XC_BROWSER=ON `
          -DWITH_XC_BROWSER_PASSKEYS=ON `
          -DWITH_XC_YUBIKEY=ON `
          -DWITH_XC_NETWORKING=OFF `
          -DWITH_XC_UPDATECHECK=OFF `
          -DWITH_XC_SSHAGENT=OFF `
          -DWITH_XC_KEESHARE=OFF `
          -DWITH_TESTS=OFF `
          -DASCIIDCTOR_EXECUTABLE=asciidoctor

    - name: Build
      shell: pwsh
      run: |
        cd build
        cmake --build . --config ${{ env.BUILD_TYPE }}

    - name: Package ZIP
      shell: pwsh
      run: |
        cd build
        mkdir package
        copy src\KeePassXC.exe package\
        xcopy /s /y src\*.dll package\  # Qt/YubiKey DLLs
        Compress-Archive -Path package\* -DestinationPath KeePassXC-2.7.11-Win64-Custom.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: KeePassXC-2.7.11-Win64-Custom
        path: build\KeePassXC-2.7.11-Win64-Custom.zip
        retention-days: 30
