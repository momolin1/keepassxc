name: KeePassXC Official Windows Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      VCPKG_ROOT: 'C:\vcpkg'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Export GitHub Actions Cache Environment
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # 1. Prepare Environment (Asciidoctor is required for the build)
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install Asciidoctor
        run: gem install asciidoctor

      # 2. Add WinRT Support (Necessary for Windows Hello)
      # We inject 'cppwinrt' into the vcpkg manifest so the linker finds Hello symbols
      - name: Add Windows Hello Support
        run: |
          $manifest = Get-Content vcpkg.json | ConvertFrom-Json
          if ($manifest.dependencies -notcontains "cppwinrt") {
              $manifest.dependencies += "cppwinrt"
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content vcpkg.json

      # 3. Configure CMake using Ninja (as recommended in the wiki)
      - name: Configure CMake
        run: |
          mkdir build
          cmake -G Ninja -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DWITH_XC_ALL=ON `
            -DCMAKE_SYSTEM_VERSION=10.0.22621.0

      # 4. Build with Ninja
      - name: Build
        run: ninja -C build -j 4

      # 5. Create the ZIP Package (Official CPack method)
      - name: Package with CPack
        run: |
          cd build
          cpack -G ZIP

      # 6. Upload the final .zip
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeePassXC-Windows-Official
          path: build/*.zip
